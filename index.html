<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Sequera de Fresno - Pedidos 2027</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Arial,sans-serif;

background:
linear-gradient(
rgba(0,0,0,.92),
rgba(0,0,0,.92)
),
url('fondo-sequera.png');

background-size:cover;
background-position:center;
background-attachment:fixed;

color:white;
}

header{
text-align:center;
padding:40px 20px;
background:rgba(0,0,0,.85);
border-bottom:3px solid #d9aa42;
}

header img{
max-width:180px;
filter:drop-shadow(0 0 10px #d9aa42);
}

header h1{
margin-top:15px;
font-size:60px;
color:#d9aa42;
text-shadow:
0 0 10px #d9aa42,
0 0 25px #d9aa42;
}

header p{
margin-top:10px;
font-size:22px;
}

.container{
max-width:1100px;
margin:auto;
padding:25px;
}

.card{
background:rgba(20,20,20,.9);
border:1px solid rgba(217,170,66,.3);
border-radius:15px;
padding:25px;
margin-bottom:25px;
backdrop-filter:blur(6px);
}

.card h2{
color:#d9aa42;
margin-bottom:15px;
}

.card img{
width:100%;
max-width:450px;
display:block;
margin:auto;
border-radius:10px;
margin-bottom:20px;
}

input,select{
width:100%;
padding:12px;
margin-top:8px;
margin-bottom:15px;
border:none;
border-radius:8px;
font-size:16px;
}

input[type=number]{
text-align:center;
}

.total{
text-align:center;
font-size:38px;
font-weight:bold;
margin:30px 0;
color:#d9aa42;
text-shadow:0 0 10px #d9aa42;
}

button{
width:100%;
padding:18px;
font-size:22px;
font-weight:bold;
border:none;
border-radius:12px;
background:linear-gradient(45deg,#900000,#ff3b3b);
color:white;
cursor:pointer;
}

button:hover{
transform:scale(1.01);
}

.footer{
text-align:center;
margin-top:40px;
font-size:22px;
color:#d9aa42;
}

@media(max-width:768px){

header h1{
font-size:38px;
}

.total{
font-size:28px;
}

}

</style>
</head>

<header>

<img
