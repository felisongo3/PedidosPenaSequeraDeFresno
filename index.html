<script>

function calcular(){

let total = 0;

total += Number(document.getElementById("normal").value) * 12.5;
total += Number(document.getElementById("oversize").value) * 15.5;
total += Number(document.getElementById("premium").value) * 17;
total += Number(document.getElementById("polo").value) * 16;
total += Number(document.getElementById("sudadera1").value) * 25;
total += Number(document.getElementById("sudadera2").value) * 30;

document.getElementById("total").innerHTML =
total.toFixed(2);

}

async function enviarPedido(){

let nombre =
document.getElementById("nombre").value;

let telefono =
document.getElementById("telefono").value;

if(nombre === ""){

alert("Introduce tu nombre");

return;

}

const datos = {

nombre: nombre,
telefono: telefono,

camiseta:
document.getElementById("normal").value,

oversize:
document.getElementById("oversize").value,

premium:
document.getElementById("premium").value,

polo:
document.getElementById("polo").value,

sudadera1:
document.getElementById("sudadera1").value,

sudadera2:
document.getElementById("sudadera2").value,

total:
document.getElementById("total").innerText

};

try{

await fetch(
"https://script.google.com/macros/s/AKfycbyqxqMgjxZua5NTtBXAKHmIeOYBU7dcbQOv8sGpqleQ4kgBAQj6ynVvM2SqS96HQEw2/exec",
{
method:"POST",
mode:"no-cors",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify(datos)
});

alert(
"✅ Pedido recibido correctamente. ¡Nos vemos en las fiestas!"
);

document.getElementById("nombre").value="";
document.getElementById("telefono").value="";

document.getElementById("normal").value=0;
document.getElementById("oversize").value=0;
document.getElementById("premium").value=0;
document.getElementById("polo").value=0;
document.getElementById("sudadera1").value=0;
document.getElementById("sudadera2").value=0;

calcular();

}
catch(error){

alert("❌ Error al enviar el pedido");

console.log(error);

}

}

</script>
