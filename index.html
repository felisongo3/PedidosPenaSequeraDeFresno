<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Sequera de Fresno - Pedidos</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Arial,sans-serif;
color:white;
background:
linear-gradient(
rgba(0,0,0,.92),
rgba(0,0,0,.92)
),
url('fondo-sequera.png');
background-size:cover;
background-position:center;
background-attachment:fixed;
}

header{
text-align:center;
padding:40px 20px;
background:rgba(0,0,0,.85);
border-bottom:3px solid #d9aa42;
}

header img{
max-width:180px;
}

header h1{
font-size:55px;
color:#d9aa42;
margin-top:15px;
text-shadow:0 0 15px #d9aa42;
}

header p{
font-size:22px;
margin-top:10px;
}

.container{
max-width:1000px;
margin:auto;
padding:20px;
}

.card{
background:rgba(30,30,30,.9);
border-radius:15px;
padding:20px;
margin-bottom:20px;
border:1px solid rgba(217,170,66,.4);
}

.card h2{
color:#d9aa42;
margin-bottom:15px;
}

.card img{
width:100%;
max-width:450px;
display:block;
margin:auto;
margin-bottom:20px;
border-radius:10px;
}

input,select{
width:100%;
padding:12px;
font-size:16px;
border:none;
border-radius:8px;
margin-top:5px;
margin-bottom:15px;
}

.total{
text-align:center;
font-size:36px;
font-weight:bold;
color:#d9aa42;
margin:30px 0;
}

button{
width:100%;
padding:18px;
font-size:22px;
font-weight:bold;
border:none;
border-radius:10px;
background:
linear-gradient(45deg,#9c0000,#ff3c3c);
color:white;
cursor:pointer;
}

.footer{
margin-top:40px;
text-align:center;
font-size:20px;
color:#d9aa42;
}

</style>
</head>

<body>

<header>

<img src="logopena.jpeg">

<h1>SEQUERA DE FRESNO</h1>

<p>🍻 Pedidos Oficiales de la Peña 🍻</p>

</header>

<div class="container">

<div class="card">

<h2>👤 Datos Personales</h2>

<input id="nombre" type="text" placeholder="Nombre y Apellidos">

<input id="telefono" type="text" placeholder="Teléfono">

</div>

<div class="card">

<h2>👕 Camiseta Normal - 12,50€</h2>

<img src="camisetas.jpeg">

<label>XS</label>
<input id="normal_xs" type="number" value="0" min="0" onchange="calcular()">

<label>S</label>
<input id="normal_s" type="number" value="0" min="0" onchange="calcular()">

<label>M</label>
<input id="normal_m" type="number" value="0" min="0" onchange="calcular()">

<label>L</label>
<input id="normal_l" type="number" value="0" min="0" onchange="calcular()">

<label>XL</label>
<input id="normal_xl" type="number" value="0" min="0" onchange="calcular()">

<label>XXL</label>
<input id="normal_xxl" type="number" value="0" min="0" onchange="calcular()">

<label>3XL</label>
<input id="normal_3xl" type="number" value="0" min="0" onchange="calcular()">
<h2>🖤 Oversize - 15,50€</h2>

<img src="camisetas.jpeg">

<select id="tallaOversize">
<option value="">Selecciona talla</option>
<option>XS</option>
<option>S</option>
<option>M</option>
<option>L</option>
<option>XL</option>
<option>XXL</option>
<option>3XL</option>
</select>

<input id="oversize" type="number" value="0" min="0" onchange="calcular()">

</div>

<div class="card">

<h2>✨ Oversize Premium - 17€</h2>

<img src="camisetas.jpeg">

<select id="tallaPremium">
<option value="">Selecciona talla</option>
<option>XS</option>
<option>S</option>
<option>M</option>
<option>L</option>
<option>XL</option>
<option>XXL</option>
<option>3XL</option>
</select>

<input id="premium" type="number" value="0" min="0" onchange="calcular()">

</div>

<div class="card">

<h2>👕 Polo - 16€</h2>

<img src="camisetas.jpeg">

<select id="tallaPolo">
<option value="">Selecciona talla</option>
<option>S</option>
<option>M</option>
<option>L</option>
<option>XL</option>
<option>XXL</option>
<option>3XL</option>
</select>

<input id="polo" type="number" value="0" min="0" onchange="calcular()">

</div>

<div class="card">

<h2>🧥 Sudadera sin capucha - 25€</h2>

<img src="camisetas.jpeg">

<select id="tallaSudadera1">
<option value="">Selecciona talla</option>
<option>S</option>
<option>M</option>
<option>L</option>
<option>XL</option>
<option>XXL</option>
<option>3XL</option>
</select>

<input id="sudadera1" type="number" value="0" min="0" onchange="calcular()">

</div>

<div class="card">

<h2>🧥 Sudadera con capucha - 30€</h2>

<img src="camisetas.jpeg">

<select id="tallaSudadera2">
<option value="">Selecciona talla</option>
<option>S</option>
<option>M</option>
<option>L</option>
<option>XL</option>
<option>XXL</option>
<option>3XL</option>
</select>

<input id="sudadera2" type="number" value="0" min="0" onchange="calcular()">

</div>

<div class="card">

<h2>🧣 Pañuelos</h2>

<img src="logopena.jpeg">

<input id="panuelos" type="number" value="0" min="0">

</div>

<div class="card">

<h2>🏷️ Pegatinas</h2>

<img src="logopena.jpeg">

<input id="pegatinas" type="number" value="0" min="0">

</div>

<div class="total">

TOTAL: <span id="total">0.00</span> €

</div>

<button onclick="enviarPedido()">
🍻 REALIZAR PEDIDO 🍻
</button>

<div class="footer">
🍻 Nos vemos en las fiestas 🍻
</div>

</div>

<script>

function calcular(){

let total = 0;

total += Number(document.getElementById("normal").value) * 12.5;
total += Number(document.getElementById("oversize").value) * 15.5;
total += Number(document.getElementById("premium").value) * 17;
total += Number(document.getElementById("polo").value) * 16;
total += Number(document.getElementById("sudadera1").value) * 25;
total += Number(document.getElementById("sudadera2").value) * 30;

document.getElementById("total").innerText =
total.toFixed(2);

}

async function enviarPedido(){

if(document.getElementById("nombre").value==""){

alert("Introduce tu nombre");

return;

}

const datos = {

nombre: document.getElementById("nombre").value,
telefono: document.getElementById("telefono").value,

camiseta: document.getElementById("normal").value,
oversize: document.getElementById("oversize").value,
premium: document.getElementById("premium").value,
polo: document.getElementById("polo").value,
sudadera1: document.getElementById("sudadera1").value,
sudadera2: document.getElementById("sudadera2").value,

tallaNormal: document.getElementById("tallaNormal").value,
tallaOversize: document.getElementById("tallaOversize").value,
tallaPremium: document.getElementById("tallaPremium").value,
tallaPolo: document.getElementById("tallaPolo").value,
tallaSudadera1: document.getElementById("tallaSudadera1").value,
tallaSudadera2: document.getElementById("tallaSudadera2").value,

panuelos: document.getElementById("panuelos").value,
pegatinas: document.getElementById("pegatinas").value,

total: document.getElementById("total").innerText

};

try{

await fetch(
"https://script.google.com/macros/s/AKfycbyAqHSusS47Pv7dV3mGG0OHepFOF4kTdjh95HVjcvUdJotKX_FMnYRmgwGdtz7MmAQl/exec",
{
method:"POST",
mode:"no-cors",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify(datos)
}
);

alert("✅ Pedido enviado correctamente");

location.reload();

}
catch(error){

alert("❌ Error al enviar pedido");

console.log(error);

}

}

</script>

</body>
</html>
